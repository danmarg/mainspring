[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mainspring"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "garminconnect>=0.2",
    "mcp[cli]>=1.0",
    "datasette>=0.65",
    "datasette-vega>=0.6",
    "altair>=5",
    "jinja2>=3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
