name: Deploy to Fly

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never run two deploys at once; queue the newer one instead of cancelling a
# deploy mid-flight (single Machine + volume).
concurrency:
  group: fly-deploy
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest -q

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: superfly/flyctl-actions/setup-flyctl@1.6
      # fly-deploy.sh also moves the hourly scheduler machine to the new image.
      - run: ./scripts/fly-deploy.sh
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
