<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mainspring — Login</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #111; color: #e0e0e0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
         display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  .box { background: #1a1a1a; border: 1px solid #2e2e2e; border-radius: 10px; padding: 2.5rem 2rem; width: 340px; }
  h1 { font-size: 1.2rem; font-weight: 700; color: #4e9af1; margin-bottom: 0.4rem; }
  p { font-size: 0.83rem; color: #888; margin-bottom: 1.5rem; }
  label { display: block; font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.05em; color: #888; margin-bottom: 0.4rem; }
  input[type=password] {
    width: 100%; padding: 0.55rem 0.75rem; background: #242424; border: 1px solid #3a3a3a;
    border-radius: 6px; color: #e0e0e0; font-size: 0.95rem; outline: none;
  }
  input[type=password]:focus { border-color: #4e9af1; }
  button {
    margin-top: 1rem; width: 100%; padding: 0.6rem; background: #4e9af1; color: #fff;
    border: none; border-radius: 6px; font-size: 0.9rem; font-weight: 600; cursor: pointer;
  }
  button:hover { background: #3d88e0; }
  .error { margin-top: 0.8rem; color: #e05c5c; font-size: 0.83rem; text-align: center; }
</style>
</head>
<body>
<div class="box">
  <h1>Mainspring</h1>
  <p>Enter your Datasette token to access the dashboard.</p>
  <form method="post" action="/dashboard/login">
    <input type="text" name="username" value="mainspring" autocomplete="username" style="display:none">
    <label for="token">Token</label>
    <input type="password" id="token" name="token" autofocus autocomplete="current-password">
    <button type="submit">Sign in</button>
  </form>
  {% if error %}<div class="error">{{ error }}</div>{% endif %}
</div>
</body>
</html>
