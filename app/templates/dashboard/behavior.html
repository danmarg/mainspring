{% extends "base.html" %}
{% block title %}Behavior{% endblock %}
{% set active_page = 'behavior' %}

{% block content %}
<h1>Behavior heatmaps</h1>


<div class="chart-block">
  <h3>Alcohol — units per day</h3>
  <div class="vega-wrap" id="alcohol-chart"></div>
</div>

<div class="chart-block">
  <h3>Caffeine — mg per day</h3>
  <div class="vega-wrap" id="caffeine-chart"></div>
</div>

<div class="two-col">
  <div class="chart-block">
    <h3>Sleep score</h3>
    <div class="vega-wrap" id="sleep-score-chart"></div>
  </div>
  <div class="chart-block">
    <h3>Sleep duration (hours)</h3>
    <div class="vega-wrap" id="sleep-dur-chart"></div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
embed('alcohol-chart',     {{ alcohol_spec|safe }});
embed('caffeine-chart',    {{ caffeine_spec|safe }});
embed('sleep-score-chart', {{ sleep_score_spec|safe }});
embed('sleep-dur-chart',   {{ sleep_dur_spec|safe }});
</script>
{% endblock %}
