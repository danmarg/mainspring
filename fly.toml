app = "mainspring"        # change to your Fly.io app name
primary_region = "fra"   # change to your preferred region

[build]

[env]
PORT = "8080"
HOME_TZ = "Europe/Berlin"
# APP_BASE_URL is set as a Fly secret (fly secrets set APP_BASE_URL=https://your-app.fly.dev)
# so it isn't exposed in this file.

[http_service]
internal_port = 8080
force_https = true
auto_stop_machines = "stop"
auto_start_machines = true
min_machines_running = 0

[[http_service.checks]]
grace_period = "10s"
interval = "30s"
method = "GET"
path = "/healthz"
timeout = "5s"

[[vm]]
memory = "512mb"
cpu_kind = "shared"
cpus = 1

[[mounts]]
source = "healthdata"
destination = "/data"
