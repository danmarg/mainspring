app = "mainspring"        # change to your Fly.io app name
primary_region = "fra"   # change to your preferred region

[build]

[env]
PORT = "8080"
HOME_TZ = "Europe/Berlin"
# APP_BASE_URL is set as a Fly secret (fly secrets set APP_BASE_URL=https://your-app.fly.dev)
# so it isn't exposed in this file.

[http_service]
internal_port = 8080
force_https = true
# "suspend" freezes/thaws the whole VM (memory incl. any in-memory MCP session
# state) instead of destroying and recreating the process like "stop" does —
# same idle cost (storage only), much faster resume, and safe to pair with
# stateful MCP sessions in app/mcp_server.py (see comment there).
auto_stop_machines = "suspend"
auto_start_machines = true
min_machines_running = 0

[[http_service.checks]]
grace_period = "10s"
interval = "30s"
method = "GET"
path = "/healthz"
timeout = "5s"

[[vm]]
memory = "512mb"
cpu_kind = "shared"
cpus = 1

[[mounts]]
source = "healthdata"
destination = "/data"
